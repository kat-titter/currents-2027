<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[s[i/y]n[k][w]hole, CURRENTS 2027</title>
<meta name="description" content="[s[i/y]n[k][w]hole, for CURRENTS 2027 in Santa Fe: a basin whose water is a machine dreaming. Every frame pours from the tap to the drain. Reach in and it follows your hand, then slips away.">
<style>
  :root { --bone:#e4dfd2; --pearl:linear-gradient(90deg, #bfe6ee, #cfc9f2, #f2c9dd); --ink:#030304; --dim:#8a8d93;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden; background:var(--ink); color:var(--dim); font:12.5px/1.75 var(--mono); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  h1 { position:fixed; left:28px; top:22px; margin:0; font:400 20px/1.1 var(--mono); letter-spacing:.42em; text-transform:uppercase;
    color:var(--bone); pointer-events:none; }
  #code { position:fixed; left:28px; bottom:22px; margin:0; font:inherit; color:var(--dim); pointer-events:none; text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 4px var(--ink), 0 0 2px var(--ink); transition:opacity .8s; }
  #code { font-size:11.5px; letter-spacing:.01em; color:rgba(138,141,147,.82); }
  #code #pr { color:var(--bone); opacity:.92; }
  #code .oref { color:#d3d9e6; background:var(--pearl); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none; }                                  /* a face from the sink: the visitor is the current dream */
  #code #grip { display:block; }
  #code .ln { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.55; }   /* two lines at most: the prompt, then the trace blended in */
  #code .tr { color:var(--bone); opacity:.48; }
  #dry { display:none; position:fixed; border:1px solid rgba(228,223,210,.30); border-radius:3.5%/4.6%; }
  body.nogpu #dry { display:block; }
  body.sink h1, body.sink #code { display:none; }                  /* in the stone: only the water */
  h1 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }   /* the name is in the tab; the page shows only the water */
  body.doc #code { display:none; }                               /* the document shows the prompt beside the mirror */
  #about { position:fixed; right:28px; bottom:22px; font-size:11.5px; color:rgba(138,141,147,.2); text-decoration:none; padding:8px 0 8px 13px; text-shadow:0 0 6px var(--ink), 0 0 2px var(--ink); transition:color .5s; }   /* the one way out of the water, barely there: the page about the piece */
  #about:hover, #about:focus-visible { color:var(--bone); transition-duration:.2s; }   /* found by a hand or a key, it reads; a tap goes straight through */
  body.wall #about { opacity:0; pointer-events:none; }   /* on the wall the way to the about page is the heavy corner itself (cornerLens); the link stays for a key or a screen reader, unseen until it has focus */
  body.wall #about:focus-visible { opacity:1; }
  body.sink #about, body.doc #about, body.framed #about { display:none; }   /* in the stone, in a document, or framed by another page: only the water */
  @media (max-width:600px) { h1 { left:16px; top:16px; font-size:16px; } #about { right:16px; bottom:13px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A basin seen from above. Water runs from the tap to the drain, carrying a dream. Press to reach in; the space bar is the plug."></canvas>
<h1 id="title">[s[i/y]n[k][w]hole</h1>
<div id="dry"></div>
<pre id="code" class="dry"><span id="water">water = None</span><span id="grip"></span></pre>
<a id="about" href="about.html">about</a>
<script>
(() => {
'use strict';
// [s[i/y]n[k][w]hole (sync == sink): a basin whose water is a machine dreaming. A spring (code/sink.py, on a GPU) writes a new prompt, dreams it, and walks the
// latent space to the next, frame by frame; every frame pours in at the tap and runs to the drain. When no spring answers, stored dreams pour from the reservoir.
// Reach in, and the water under your hand goes where your hand goes, for a moment; then it slips through your fingers, down the drain.
// The water engine began as veritas (verse/sync.html, the web basin of Vanitas Veritas, a separate piece that keeps its own page and its gold).
const canvas = document.getElementById('c'), title = document.getElementById('title');
const waterEl = document.getElementById('water'), gripEl = document.getElementById('grip'), codeEl = document.getElementById('code'), dry = document.getElementById('dry');
// The look is the page: every setting in LOOK holds with a bare address. The same name in the address overrides it (?k=0: plain water; ?k=1: all the way in),
// and <name>=off takes a default away (?kc=off: the line under the basin; ?kn=off, ?kf=off: time and the face follow k; ?km=off: no memory; ?kv=1: the fold; ?kw=off: the dream's own warm tones; ?reservoir=off; ?solo=off: the shared relays; ?r=off: one basin, its heart at 3.71).
const LOOK = { k:'0.25', kn:'0.5', kf:'0.5', kb:'1', kc:'rim', km:'1', kw:'1', reservoir:'', solo:'', fill:'1', qd:'1', bh:'1', r:'grid' };   // r=grid: Kat 2026-11-21 picked it from four concepts, "grid best, but denser, less text" (?r=off: the one basin, its heart at 3.71, the piece before)   // fill, qd, bh: Kat 2026-11-19, "piece should fill page. more discrete quanta like dots of light ... helps see warping of time and space", "almost cosmic: black hole"   // km memory: on since Kat's "turn on fold and memory, drop the rest"; the fold off again since "the fold feels a bit basic, weird, ugly" (2026-11-17)
const params = new URLSearchParams(LOOK);
for (const [name, value] of new URLSearchParams(location.search)) { if (value === 'off') params.delete(name); else params.set(name, value); }
if (window.top !== window.self) document.body.classList.add('framed');
if (params.has('sink')) document.body.classList.add('sink');
if (params.has('doc')) document.body.classList.add('doc');
const SPRING_HOME = '', POINTER_HOME = 'https://kat-titter.github.io/vanitas-veritas/verse/spring.json';                           // the spring's public address, once it has one; until then, on the web, the water is off
let SPRING = params.has('spring') ? (params.get('spring') || 'feed/') : SPRING_HOME;
if (!SPRING && !params.get('img')) fetch(POINTER_HOME + '?t=' + Date.now(), { cache:'no-store' }).then((r) => r.json()).then((j) => { if (j && j.feed) SPRING = j.feed; }).catch(() => {});   // on either public address: where the spring is now (one pointer, which sink.py rewrites)
const SMALL = Math.min(innerWidth, innerHeight) < 600 || matchMedia('(pointer: coarse)').matches;
const SIM = 256, PI_N = SMALL ? 24 : 36, BX = 0.46, BY = 0.345, HOLE = 0.046;   // the basin: a rectangle, 4:3 like the dreams
let DYE = 1024, BIG = false;                       // the water's own resolution, set from the basin's size on screen
const TAP = [0.5, 0.5 + 0.27];
// ?k=<0 to 1>: how far in. 0.25 unless set (LOOK); 0 is plain water: every k line in this file sits behind K > 0.
//   1 the water runs backwards for stretches, and bubbles un-pop          4 soft while a hand is in, clear for a breath as it leaves, then down the drain
//   2 the hole holds the basin: round the drain the picture repeats       5 lost = mm:ss, how long the hand was in
//   3 draining, the basin beats 1 to 3 times a second under a shimmer     6 time stutters, the picture lags its current, the water answers late
//   7 an iridescent sheen, as on a soap film or the inside of a shell; no gold
//   8 a face, barely: the dream again under the water, mirrored, larger, soft; it surfaces and sinks, and you are not sure you saw it
//   9 draining, time runs slow at first, then fast, and fastest at the hole. ?kd=<0 to 1> is its own strength: 1 unless set, 0 a true clock
// The nasty has its own strength, apart from the look. Unset, both are k and the water is as it was:
//   ?kn=<0 to 1> weird time (1 and 6: backwards, the stall, the skip, the picture's lag). Set, time is also drawn: the picture leans from the hole as the clock slows, and into it as the clock runs fast
//   ?kf=<0 to 1> the face (8). Set, it stands upright over the drain: two hollows above the hole, and the hole is its mouth
// The frame and the words, both off unless set:
//   ?kb=<0 to 1> no clear border: the steel lip goes and the water fades unevenly into the dark, so the basin is implied by its light
//   ?kc=rim the code, hidden: no line under the basin; lost = mm:ss shows only in the clear breath, small along the drain's rim. Any other ?kc: no code at all
//   ?km=<0 to 1> memory, after Wind Map (Viegas and Wattenberg): slow patches of the basin re-form up to 33 times slower, so they hold an older dream, softer, while the rest moves on. 0 unless set
//   ?kv=<0 to 1> the fold: a crease from the tap through the drain; once in every 46 s one half of the basin folds over onto the other and each is the other's mirror. Draining, the bowl is lit as a dome. 0 unless set
//   ?kw=<0 to 1> warmth out: where a dream is gold, copper or brown, its colour goes grey before it reaches the eye; cool and rose stay. 1 in LOOK: the piece is pearl
// ?kx=<digits> keeps only those moves (kx=25: the hole and the lost line).
const K = Math.max(0, Math.min(1, parseFloat(params.get('k')) || 0)), KX = params.get('kx') || '123456789', kOn = (n) => K > 0 && KX.includes(n);
const kNum = (name, def) => params.has(name) ? Math.max(0, Math.min(1, parseFloat(params.get(name)) || 0)) : def;   // a strength of its own, 0 to 1
const KD = kOn('9') ? kNum('kd', 1) : 0, KN = kNum('kn', K), KLEAN = K > 0 && params.has('kn'), KF = kNum('kf', K), KFACE = K > 0 && params.has('kf');
const KE = K > 0 ? kNum('kb', 0) : 0, KC = K > 0 && params.has('kc') ? (params.get('kc') === 'rim' ? 'rim' : 'none') : '';
const KM = K > 0 ? kNum('km', 0) : 0;   // memory: how much longer the slow patches hold a dream
const KV = K > 0 ? kNum('kv', 0) : 0;   // the fold: how far the basin folds over itself
const KW = K > 0 ? kNum('kw', 0) : 0;   // warmth out: how much of a dream's gold and copper goes grey
// ?qd=<0 to 1> quanta: the picture as dots of light on the grid it was dreamed in; each dot keeps its own clock, so you can see where time runs slow. ?qn=<cells across>, 128 unless set
// ?bh=<0 to 1> the hole as a black hole: it bends the grid of dots round it (a ring where the light behind it is focused, and inside the ring the basin again, upside down),
//   drags it into a slow twist, and slows the dots' clocks to a stop at its edge, where their light goes to rose. A thin ring of light at the edge of the dark
const QD = K > 0 ? kNum('qd', 0) : 0, QN = Math.max(24, Math.min(256, parseInt(params.get('qn')) || 128)), BH = K > 0 ? kNum('bh', 0) : 0;
// ?r=<2.5 to 4>: the heart's own r, the logistic map that spaces its beats, held there (3.71 with ?r=off: past the edge of chaos). Concepts for many hearts (Kat 2026-11-20, "grid of heartbeats with different parameters"), each a way of choosing r:
//   ?r=grid   (in LOOK, so the bare address; not in the stone or a document unless asked) forty-eight basins, one water: along the long side r steps from order (2.9, a steady beat) into chaos (4), along the short side the pace a hair; the dots show the beats' values, so each copy's period is drawn. Tap one to go in; inside, tap the drain to fall through it, through one point, back into the same basin; pull from the drain to the rim to climb out (Esc, two fingers, or 30 s alone)
//   ?r=sync   seven hearts in one basin, each its own r and pace; a ring that reaches a heart pulls its next beat early, so they drift, lock and slip; a tap is a beat too
//   ?r=field  every dot a heart, coupled to its four neighbours (a coupled map lattice, after Kaneko); the hand is a point on the plane of r (across) and coupling (up)
//   ?r=held   the hold is the dial: a hand in the water steadies the heart, then, the longer it stays, walks it past the edge into chaos
const RF = K > 0 && (!(params.has('sink') || params.has('doc')) || new URLSearchParams(location.search).has('r')) ? params.get('r') || '' : '',   // the stone and the documents keep the one basin unless they ask
      RCON = /^(grid|sync|field|held)$/.test(RF) ? RF : '', KR = !RF || RCON ? 3.71 : Math.max(2.5, Math.min(4, parseFloat(RF) || 3.71));
const RN = RCON === 'sync' ? 32 : 16, RL = RCON === 'sync' ? 3.5 : 6.5;   // ripples at once, and how long each lives: seven hearts need more, shorter
const hg = { a:0, t:0 };   // ?bh: how much gravity the hand has now (eased)
// ?qd glyphs (Kat: "Yes, glyphs"; after v2's code in the grain): where a dot dies (near the hole, near a hand, everywhere as the basin drains) it turns into one letter of the page's own code line, read along its row
const gx = { tex:null, codes:new Float32Array(192), n:1, line:'' };
function gxAtlas(){                       // printable ASCII and a dot, 16 by 6 slots of 48 px, the page's mono font, pale bone on black; made once
  const P = 48, cv = document.createElement('canvas'); cv.width = 16*P; cv.height = 6*P;
  const x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, cv.width, cv.height);
  x.font = `${Math.round(P*0.72)}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
  x.fillStyle = '#e4dfd2'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let i = 0; i < 96; i++) x.fillText(i < 95 ? String.fromCharCode(32 + i) : '·', (i % 16 + 0.5)*P, (Math.floor(i/16) + 0.55)*P);
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cv); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const GX_WORDS = '[s]ink  [d]rain  s[pace]  [k]now  [c]lock  [h]old  pe[a]rl  [w]hole  ';   // a bracket hides a letter; take it out and the word says something else (Kat: "Yes, bracket words")
function gxLine(){                        // the line as the page writes it while a dream pours: the prompt, or the reservoir (without its comment); draining or dry, the bracket words
  const t = RCON === 'grid' ? GX_WORDS : water > 0.5 && live.prompt ? `water = dream("${live.prompt}")` : RES && res.on && water > 0.5 ? RES_LINE.split('  #')[0] : GX_WORDS;   // the grid's letters are always the bracket words
  if (t === gx.line) return; gx.line = t; gx.n = Math.max(1, Math.min(192, t.length));
  for (let i = 0; i < gx.n; i++) { const c = t.charCodeAt(i); gx.codes[i] = c >= 32 && c < 127 ? c - 32 : 95; }
}

const view = { w:1, h:1, cx:0, cy:0, S:1, dpr:1 };
function layout(){
  const w = innerWidth, h = innerHeight; view.w = w; view.h = h; view.dpr = Math.min(params.has('qd') ? 3 : 2, devicePixelRatio || 1);   // the dots are drawn at the screen's own pixels, up to 3 a point: crisp (Kat: "resolution should be very high, crisp visuals")
  const fit = params.has('sink') || params.has('doc') ? [1, 1] : w < 600 ? [0.94, 0.62] : [0.80, 0.74];   // in the stone the hole masks the edge; on the web, room for the words
  view.S = Math.min(fit[0]*w/(2*BX), fit[1]*h/(2*BY)); view.cx = w/2; view.cy = h/2;
  if (params.has('fill') && !params.has('sink') && !params.has('doc')) view.S = 1.02*Math.max(w/(2*BX), h/(2*BY));   // ?fill: the water fills the page, its edges past the screen's
  const hw = BX*view.S, hh = BY*view.S;
  Object.assign(dry.style, { left:`${view.cx - hw}px`, top:`${view.cy - hh}px`, width:`${2*hw}px`, height:`${2*hh}px` });
  Object.assign(codeEl.style, { left:`${view.cx - hw}px`, width:`${2*hw}px`, top:`${view.cy + hh + Math.min(28, (h/2 - hh)*0.35)}px`, bottom:'auto' });
  fitCode();
}
function fitCode(){                                   // two lines at most, as wide as the basin: the type shrinks to fit, to 10 px; past that a line ends in an ellipsis
  codeEl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(codeEl).fontSize), w = codeEl.clientWidth, lines = [...waterEl.querySelectorAll('.ln')];
  const line = lines.length ? Math.max(...lines.map((l) => l.scrollWidth)) : waterEl.getBoundingClientRect().width;
  if (line > w && w > 0) codeEl.style.fontSize = Math.max(10, base*w/line*0.98) + 'px';
}
layout();
{ const px = 2*BX*view.S*view.dpr;              // a 4K screen gets the spring's full frames and water fine enough to show them
  DYE = SMALL ? 768 : px > 1800 ? 2048 : px > 1200 ? 1536 : 1024; BIG = px > 1400; }

const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:params.has('snap') });   // ?snap: the documents capture stills of the layers
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {           // no GPU: the tap is dry
  document.body.classList.add('nogpu'); addEventListener('resize', layout); return;
}

const COMMON = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const vec2  C  = vec2(0.5);
const vec2  B  = vec2(0.46, 0.345);   // the basin: half its width and height, a 4:3 rectangle like the dreams
const float RC = 0.035;   // the bowl's rounded corners
const float R  = 0.345;   // the reach of the drain's pull: the basin's short half
float sdBox(vec2 q){ vec2 d = abs(q)-B+RC; return length(max(d,0.)) + min(max(d.x,d.y),0.) - RC; }   // signed distance to the wall: below 0 inside
const float RD = 0.030;   // drain
const float SF = 0.034;   // tap footprint
const float SD = 0.030;   // drain footprint
float wall(vec2 p){ return 1.0 - smoothstep(-0.004, 0., sdBox(p-C)); }
bool inside(vec2 p){ return sdBox(p-C) < 0.; }
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float hash1(float n){ return fract(sin(n*127.1+3.7)*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
`;
const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const FS = {
curl: `
uniform sampler2D uVel; uniform float uH;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).y, Rr = texture(uVel, vUv+vec2(uH,0.)).y;
  float B = texture(uVel, vUv-vec2(0.,uH)).x, T  = texture(uVel, vUv+vec2(0.,uH)).x;
  o = vec4(((Rr-L)-(T-B))*0.5/uH, 0.,0.,1.);
}`,

// body forces: small eddies kept alive, the drain's vortex, the stream falling from the tap, and the hand
force: `
uniform sampler2D uVel, uCurl;
uniform float uH, uDt, uConf, uSwirl, uTime, uStream;
uniform vec2 uStirPos, uStirVel, uTap, uGrabVel;
uniform vec4 uGrab;                                   // the hand in the water: where, how hard it still grips, how wide the palm
uniform vec4 uRH[4]; uniform float uRG[4], uRN;       // hands in other basins: where, the push they give, how hard they grip
void main(){
  vec2 v = texture(uVel, vUv).xy;
  float cL = texture(uCurl, vUv-vec2(uH,0.)).x, cR = texture(uCurl, vUv+vec2(uH,0.)).x;
  float cB = texture(uCurl, vUv-vec2(0.,uH)).x, cT = texture(uCurl, vUv+vec2(0.,uH)).x;
  float cC = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(cT)-abs(cB), abs(cR)-abs(cL));
  f /= length(f)+1e-4; f *= uConf*cC; f.y *= -1.;
  v += f*uDt;
  // the drain: a Burgers vortex, fast round the hole and slow far from it
  vec2 d = vUv-C; float r2 = dot(d,d), r = sqrt(r2)+1e-5;
  vec2 th = vec2(-d.y, d.x)/r;
  float vt = uSwirl*(1.-exp(-r2/0.0016))/r;
  v += th*(vt-dot(v,th))*(1.-exp(-0.8*uDt))*smoothstep(R, R*0.45, r);
  // where the stream lands, the water churns: two small eddies that wander, turning opposite ways
  for (int k = 0; k < 2; k++) {
    float s = float(k)*2.-1.;
    vec2 e = vUv-uTap-0.018*vec2(sin(uTime*1.7+s*2.), cos(uTime*1.3+s))-vec2(s*0.012, 0.);
    float e2 = dot(e,e);
    v += s*vec2(-e.y, e.x)*uStream*exp(-e2/0.0005)*uDt*24.;
  }
  // a hand moving through the water pushes it
  vec2 s = vUv-uStirPos;
  v += uStirVel*exp(-dot(s,s)/0.0022);
  // a hand holding: the water under the palm goes where the hand goes, except between the fingers
  vec2 g = vUv-uGrab.xy; float gr = length(g);
  float fingers = mix(0.15, 1., smoothstep(0.2, 0.8, 0.5+0.5*cos(5.*atan(g.y, g.x)+0.6)));
  float m = uGrab.z*exp(-gr*gr/(uGrab.w*uGrab.w))*mix(1., fingers, smoothstep(0.35, 0.95, gr/uGrab.w));
  v = mix(v, uGrabVel, m*(1.-exp(-30.*uDt)));
  for (int i = 0; i < 4; i++) {                       // the same water, touched from another basin
    if (float(i) >= uRN) break;
    vec2 e = vUv-uRH[i].xy; float e2 = dot(e,e);
    v += uRH[i].zw*exp(-e2/0.0022);
    v = mix(v, vec2(0.), uRG[i]*exp(-e2/0.0036)*(1.-exp(-30.*uDt)));
  }
  o = vec4(v*wall(vUv),0.,1.);
}`,

advect: `
uniform sampler2D uVel, uSrc; uniform float uDt, uDiss;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  o = texture(uSrc, p)*exp(-uDiss*uDt)*wall(vUv);
}`,

// divergence, minus what the tap adds and the drain takes
diverge: `
uniform sampler2D uVel; uniform float uH, uQ, uQd; uniform vec2 uTap;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).x, Rr = texture(uVel, vUv+vec2(uH,0.)).x;
  float B = texture(uVel, vUv-vec2(0.,uH)).y, T  = texture(uVel, vUv+vec2(0.,uH)).y;
  float div = ((Rr-L)+(T-B))*0.5/uH;
  vec2 a = vUv-uTap, b = vUv-C;
  float src = uQ/(3.14159*SF*SF)*exp(-dot(a,a)/(SF*SF)) - uQd/(3.14159*SD*SD)*exp(-dot(b,b)/(SD*SD));
  o = vec4(div-src,0.,0.,1.);
}`,

pressure: `
uniform sampler2D uP, uDiv; uniform float uH;
