# The refill: the reservoir the page pours while the spring sleeps, dreamed again on a runner (refill/refill.py)
# out of the water the page pours now, and published with the pages. The repo is the site; the piece lives in its folder DIR (below),
# with reservoir/ beside its page, built from src/ (src/deploy.py), which is never published. The frames never enter git: the
# site is deployed from this run's own files (Pages source: GitHub Actions), and the last water is read back from the live page,
# which is all the memory the loop has; its taste leans on the water banked by hand in this repo (reservoir/).
# A push to main publishes the pages with the water as it is.
#
# How often is one setting, the hours between refills (the clock below ticks every hour and asks whether one is due):
#   gh variable set REFILL_EVERY --body 24      one allocation of dream a day: the dry season
#   gh variable set REFILL_EVERY --body 3       every three hours (1: every hour)
#   gh variable set REFILL_EVERY --body off     no refills; the page keeps pouring the last water
#   gh workflow run refill.yml [-f mode=text]   one refill now
#   gh variable set REFILL_MODE --body text     every refill from the words alone (loop: out of the last water)
name: refill
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "loop: new water out of the last. text: from the words alone"
        type: choice
        options: [loop, text]
        default: loop
  push:
    branches: [main]
  pull_request:                         # a change to the refill gets a dry run: a batch dreamed each way, nothing published
    paths: ['.github/workflows/refill.yml', 'refill/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dry-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DIR: synkhole                           # the piece's folder in the site: its page, and reservoir/ beside it
  PAGE: ${{ vars.REFILL_PAGE }}           # only for a custom domain; otherwise https://<owner>.github.io/<repo>/

jobs:
  water:
    if: github.event_name != 'schedule' || (vars.REFILL_EVERY && vars.REFILL_EVERY != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write                    # only for "stay scheduled" below
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["loop","text"]' || format('["{0}"]', inputs.mode || vars.REFILL_MODE || 'loop')) }}
    outputs:
      publish: ${{ steps.now.outputs.publish }}
    steps:
      - name: the built pages
        uses: actions/checkout@v4
        with:
          path: site

      - name: the water on the page now, and whether new water is due
        id: now
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          EVERY: ${{ vars.REFILL_EVERY }}
        run: |
          import datetime, json, os, pathlib, re, shutil, urllib.request
          owner, name = os.environ['GITHUB_REPOSITORY'].split('/')
          piece = os.environ['DIR'].strip('/')
          page = (os.environ.get('PAGE') or f'https://{owner}.github.io/{name}/').rstrip('/') + f'/{piece}/reservoir/'
          live, kept = pathlib.Path('live'), pathlib.Path('site')/piece/'reservoir'
          def get(name):
              if not re.fullmatch(r'[\w.-]+\.(jpg|json)', name): raise ValueError(f'not a frame name: {name!r}')
              with urllib.request.urlopen(page + name, timeout=60) as r: (live/name).write_bytes(r.read())
          try:
              live.mkdir(); get('index.json')
              for f in (f for r in json.loads((live/'index.json').read_text())['runs'] for f in r): get(f)
          except Exception as e:
              print(f'the page gave no water ({e!r})'); shutil.rmtree(live, ignore_errors=True)
          index = lambda d: json.loads((d/'index.json').read_text()) if (d/'index.json').exists() else {}
          if kept.exists(): shutil.copytree(kept, 'banked')      # the water banked by hand: the loop's taste leans on it, and starts again from it
          # the newer water pours; on a tie, the water kept in this repo: it was banked by hand (src/reservoir.py)
          if index(live).get('made', '') > index(kept).get('made', ''):
              print(f'the water on the page (made {index(live)["made"]}) is newer than the water kept here (made {index(kept).get("made", "never")})')
              shutil.rmtree(kept, ignore_errors=True); live.rename(kept)
          else: print(f'the water kept here (made {index(kept).get("made", "never")}) pours; on the page: made {index(live).get("made", "none")}')
          event, due = os.environ['EVENT'], True
          if event == 'schedule':                 # the clock ticks every hour: is the water older than the hours between refills?
              v = os.environ.get('EVERY', '')
              try: every = {'daily': 24.0, 'hourly': 1.0}.get(v) or float(v)
              except ValueError: every = 24.0; print(f'REFILL_EVERY is {v!r}, not a number of hours: read as 24')
              try:
                  at = datetime.datetime.strptime(index(kept)['made_at'], '%Y-%m-%dT%H:%MZ').replace(tzinfo=datetime.timezone.utc)
                  age = (datetime.datetime.now(datetime.timezone.utc) - at).total_seconds()/3600; due = age >= every - 0.5
                  print(f'the water is {age:.1f} hours old; a refill every {every:g} hours: {"due" if due else "not due"}')
              except (KeyError, ValueError): print('the water carries no time (banked by hand): a refill is due')
          dream, publish = event != 'push' and due, event != 'pull_request' and due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'dream={str(dream).lower()}\npublish={str(publish).lower()}\n')

      - uses: actions/setup-python@v5
        if: steps.now.outputs.dream == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site/refill/requirements.txt

      - name: the weights, kept between refills
        if: steps.now.outputs.dream == 'true'
        id: weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: refill-sd15-fp16-lcm-1

      - name: dream
        if: steps.now.outputs.dream == 'true'
        env:
          HF_HUB_OFFLINE: ${{ steps.weights.outputs.cache-hit == 'true' && '1' || '0' }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          pip install -q -r site/refill/requirements.txt
          python site/refill/refill.py --selftest
          if [ "${{ matrix.mode }}" = loop ]; then FROM="--from site/$DIR/reservoir --banked banked"; else FROM=""; fi
          python site/refill/refill.py $FROM --out water
          rm -rf "site/$DIR/reservoir" && mv water "site/$DIR/reservoir"

      - name: check the water
        shell: python
        run: |
          import json, os, pathlib, re, sys
          R = pathlib.Path('site')/os.environ['DIR'].strip('/')/'reservoir'; m = json.loads((R/'index.json').read_text()); runs = m['runs']
          listed = [f for r in runs for f in r]; there = {f.name: f.stat().st_size for f in R.iterdir()}; total = sum(there.values())
          wrong = ([f'{f} is listed and missing' for f in listed if f not in there] + [f'{f} is not listed' for f in there if f not in listed + ['index.json']]
                   + [f'{f} is not a name the page reads' for f in listed if not re.fullmatch(r'[\w.-]+\.jpg', f)]
                   + [f'{f} is {there[f]} bytes: an empty frame' for f in listed if there.get(f, 1e9) < 5000]
                   + ([f'{total} bytes: over 6,000,000'] if total > 6_000_000 else []) + (['no frames'] if not listed else [])
                   + (['a prompt carries --oref: a face at the sink'] if any('--oref' in p for p in m.get('prompts', [])) else []))
          print(f'{len(runs)} dreams, {len(listed)} frames, {total} bytes, made {m.get("made_at") or m.get("made")}: {m.get("from")}')
          for p in m.get('prompts', []): print('  ', p)
          if wrong: sys.exit('the water is not whole, nothing is published:\n  ' + '\n  '.join(wrong))

      - name: the batch, to look at
        if: steps.now.outputs.dream == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: water-${{ matrix.mode }}
          path: site/${{ env.DIR }}/reservoir
          retention-days: 14

      - name: the pages, with the water
        if: steps.now.outputs.publish == 'true'
        run: rm -rf site/.git site/.github site/refill site/src     # src/: the source; synkhole/ holds the built piece

      - uses: actions/upload-pages-artifact@v3
        if: steps.now.outputs.publish == 'true'
        with:
          path: site

      - name: stay scheduled        # GitHub switches a schedule off after 60 days with no activity in a public repo; a refill makes no commits
        if: github.event_name == 'schedule' && steps.now.outputs.dream == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refill.yml/enable" || echo "could not re-enable; a push to this repo before day 60 does the same"

  publish:
    needs: water
    if: needs.water.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.go.outputs.page_url }}
    steps:
      - id: go
        uses: actions/deploy-pages@v4
